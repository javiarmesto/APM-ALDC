name: aldc
version: 4.1.0
description: >-
  AL Development Collection - skills-based, spec-driven, TDD-orchestrated
  development framework for Microsoft Dynamics 365 Business Central.
  GitHub Copilot distribution; the Claude Code distribution is
  javiarmesto/APM-ALDC---Claude.
author: javiarmesto
license: MIT

target: [copilot]

dependencies:
  apm: []
  mcp:
    - name: github-mcp-server
      registry: false
      transport: http
      url: "https://api.githubcopilot.com/mcp/"
    - name: markitdown-mcp
      registry: false
      transport: stdio
      command: uvx
      args: ["markitdown-mcp@0.0.1a4"]
    - name: microsoftdocs-mcp
      registry: false
      transport: http
      url: "https://learn.microsoft.com/api/mcp"
    - name: al-symbols-mcp
      registry: false
      transport: stdio
      command: npx
      args: ["al-mcp-server"]

includes: auto
scripts:
  # Cross-platform consumer setup (run after `apm install`). Seeds the
  # non-primitive pieces apm install does not deploy: Copilot entrypoint,
  # aldc.yaml, plans/memory.md, tools/. Consumers point node at the deployed
  # skill path (.agents/skills/...).
  scaffold: node .apm/skills/github-scaffold/scripts/Install-Scaffold.mjs
