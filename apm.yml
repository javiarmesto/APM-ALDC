name: aldc
version: 3.2.6
description: >-
  AL Development Collection - skills-based, spec-driven, TDD-orchestrated
  development framework for Microsoft Dynamics 365 Business Central.
  Works with GitHub Copilot and Claude Code.
author: javiarmesto
license: MIT

target: [copilot, claude]

dependencies:
  apm: []
  mcp:
    - name: github-mcp-server
      registry: false
      transport: http
      url: "https://api.githubcopilot.com/mcp/"
    - name: markitdown-mcp
      registry: false
      transport: stdio
      command: uvx
      args: ["markitdown-mcp@0.0.1a4"]
    - name: microsoftdocs-mcp
      registry: false
      transport: http
      url: "https://learn.microsoft.com/api/mcp"
    - name: al-symbols-mcp
      registry: false
      transport: stdio
      command: npx
      args: ["al-mcp-server"]

includes: auto
scripts:
  scaffold: powershell -ExecutionPolicy Bypass -File .agents/skills/github-scaffold/scripts/Install-Scaffold.ps1
